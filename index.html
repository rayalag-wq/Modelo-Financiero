<html lang="es"><head><meta charset="utf-8">

<title>Sistema financiero — Compu Demo</title>

:root[data-theme="dark"]{--bg:#12161c;--sf:#1a2029;--tx:#e8ecf2;--mu:#98a2b3;--bd:#2a3340;--ac:#4cc29b;--ac2:#18332b;--ok:#4cc27e;--wn:#f0a64a;--bad:#f2766b;--inf:#7ab0ff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,"Segoe UI",Roboto,Arial,sans-serif}
.app{display:flex;min-height:100vh}
nav{width:210px;flex:none;background:var(--sf);border-right:1px solid var(--bd);padding:16px 10px;position:sticky;top:0;align-self:flex-start;height:100vh;overflow:auto}
nav h1{font-size:15px;margin:0 8px 2px}nav small{display:block;margin:0 8px 14px;color:var(--mu)}
nav b{display:block;margin:12px 8px 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
nav button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--tx);padding:7px 10px;border-radius:8px;font:inherit;cursor:pointer}
nav button:hover{background:var(--bg)}nav button.on{background:var(--ac2);color:var(--ac);font-weight:600}
main{flex:1;min-width:0;padding:22px 26px}
h2{margin:0 0 4px;font-size:21px}.sub{color:var(--mu);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px 16px}
.k{color:var(--mu);font-size:12px}.v{font-size:21px;font-weight:650;margin-top:2px}.neg{color:var(--bad)}.pos{color:var(--ok)}
.row2{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}@media(max-width:900px){.row2{grid-template-columns:1fr}}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select{font:inherit;background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:7px 14px;font:inherit;cursor:pointer}
:root:not([data-theme="light"]) .btn{color:#0b1a14}
.btn.g{background:none;color:var(--ac);border:1px solid var(--bd)}
.tw{overflow-x:auto;background:var(--sf);border:1px solid var(--bd);border-radius:12px}
table{border-collapse:collapse;width:100%;white-space:nowrap}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--bd)}
th{font-size:12px;color:var(--mu);font-weight:600;background:var(--bg);position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}tbody tr:hover{background:var(--bg)}tr.cl{cursor:pointer}
.p{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--bg)}
.p.ok{color:var(--ok)}.p.wn{color:var(--wn)}.p.bad{color:var(--bad)}.p.inf{color:var(--inf)}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;margin-top:10px}
.bars div.m{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars .g{display:flex;align-items:flex-end;gap:2px;height:122px}.bars i{width:9px;border-radius:3px 3px 0 0;display:block}
.bars span{font-size:10px;color:var(--mu)}.lg{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-top:8px}.lg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.ag{display:grid;gap:7px;margin-top:10px}.ag div{display:grid;grid-template-columns:78px 1fr 96px;gap:8px;align-items:center;font-size:12px}.ag s{display:block;height:9px;border-radius:5px;background:var(--wn)}
.bl{display:grid;grid-template-columns:1fr auto;gap:2px 12px;margin-top:8px}.bl span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.note{color:var(--mu);font-size:12px;margin-top:8px}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--sf);color:var(--tx);padding:20px;width:min(640px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}dialog h3{margin:0 0 12px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f label{display:grid;gap:3px;font-size:12px;color:var(--mu)}
.top{display:none}@media(max-width:760px){.app{display:block}nav{width:auto;height:auto;position:static;display:flex;flex-wrap:wrap;gap:4px}nav b,nav small{display:none}nav button{width:auto}main{padding:16px}.f{grid-template-columns:1fr}}
</style></head><body>

 const kp=(k,v,c)=>`<div class="card"><div class="k">${k}</div><div class="v ${c||''}">${v}</div></div>`;
 $('#main').innerHTML=`<h2>Conciliación bancaria</h2><p class="sub">Cruce de los débitos del banco contra las facturas de compra. Clasifique los movimientos pendientes.</p>
 <div class="grid">${kp('Débitos del banco',Q(sum(E,r=>r.Monto)))}${kp('Ligados a una factura',Q(sum(lig,r=>r.Monto)))}${kp('Sin clasificar ('+sin.length+')',Q(sum(sin,r=>r.Monto)),sin.length?'neg':'pos')}${kp('Avance de conciliación',(100-sin.length/E.length*100).toFixed(1)+' %')}</div>
 <div class="tw" style="max-height:480px"><table><thead><tr><th>ID</th><th>Fecha</th><th>Descripción bancaria</th><th class="n">Monto</th><th>Clasificar como</th></tr></thead><tbody>${sin.slice(0,60).map(r=>`<tr><td>${r['ID Egreso']}</td><td>${r.Fecha}</td><td>${esc(r['Notas / descripción del banco']||r['Descripción'])}</td><td class="n">${Q(r.Monto)}</td><td><select data-e="${r['ID Egreso']}"><option value="">Elegir rubro…</option>${rb.map(x=>`<option>${esc(x)}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan=5>Todo conciliado.</td></tr>'}</tbody></table></div><p class="note">${sin.length>60?'Mostrando los primeros 60 pendientes.':''} Al elegir un rubro el movimiento pasa a clasificado.</p>`;
 document.querySelectorAll('[data-e]').forEach(s=>s.onchange=()=>{if(!s.value)return;const r=E.find(x=>x['ID Egreso']===s.dataset.e);r.Rubro=s.value;r.Control='Clasificado';concil()})}
function param(){$('#main').innerHTML=`<h2>Parámetros</h2><p class="sub">Régimen tributario y reglas de planilla del modelo.</p><div class="tw"><table><tbody>${D.params.map(([a,b])=>`<tr><td>${esc(a)}</td><td class="n">${typeof b==='number'&&b<1?(b*100).toFixed(2)+' %':esc(b)}</td></tr>`).join('')}</tbody></table></div>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go)});
nav();go('dash');
</script></body></html>
